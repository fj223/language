services:
  mysql:
    image: mysql:8.4
    container_name: openedu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jiaoyu}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - openedu-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openedu-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://root:root@mysql:3306/jiaoyu}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-to-a-strong-secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-strong-jwt-secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-your-api-key-here}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.siliconflow.cn/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-ai/DeepSeek-V3}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - openedu-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openedu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - openedu-net

volumes:
  mysql_data:
    driver: local

networks:
  openedu-net:
    driver: bridge
